name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: statusbutler
    steps:
      - uses: actions/checkout@v4

      # runner 自带 Xcode 26 工具链（本地才需要 swiftly），打印以便诊断
      - name: 工具链信息
        run: |
          xcode-select -p
          swift --version

      - name: 构建
        shell: bash
        run: |
          set -o pipefail
          if ! swift build 2>&1 | tee /tmp/build.log; then
            grep -E "error:" /tmp/build.log | sed 's/^/::error::/' | head -20
            exit 1
          fi

      - name: 测试（Swift Testing）
        shell: bash
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee /tmp/test.log; then
            echo "=== 失败用例（来自 CI 注解诊断）==="
            grep -E "recorded an issue|failed after .* with" /tmp/test.log | sed 's/^/::error::/' | head -25
            exit 1
          fi

      - name: Release 构建 + 组包冒烟
        run: bash scripts/build-app.sh release no-open
