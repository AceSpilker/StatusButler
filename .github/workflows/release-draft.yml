# T-056a（B1·发布链）：tag push (v*) 触发的发布草稿流水线。
# 与 ci.yml 同源的验证门（swift test + release 组包），产物以 artifact 形态交付；
# 真正的 GitHub Release 发布（Developer ID 签名/公证 + gh release）留待 Secrets 配置后
# 以 manual workflow_dispatch 接入（见文件末尾 TODO 注释块）。
name: Release Draft

on:
  push:
    tags: ['v*']
  # 手动触发：Secrets 配置前用于发布链预检（不打 tag 也能全链路跑一遍）
  workflow_dispatch:

jobs:
  release-draft:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: statusbutler
    steps:
      - uses: actions/checkout@v4

      # 与 ci.yml 同方式：runner 自带 Xcode 26 工具链（本地才需要 swiftly），打印以便诊断
      - name: 工具链信息
        run: |
          xcode-select -p
          swift --version

      - name: 测试（Swift Testing）
        shell: bash
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee /tmp/test.log; then
            echo "=== 失败用例（来自 CI 注解诊断）==="
            grep -E "recorded an issue|failed after .* with" /tmp/test.log | sed 's/^/::error::/' | head -25
            exit 1
          fi

      - name: 发布链（release 构建 → DMG UDZO → SHA-256 → 自校验）
        run: bash scripts/release-app.sh --no-publish

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: statusbutler-release-draft
          path: |
            statusbutler/dist/*.dmg
            statusbutler/dist/*.sha256
          if-no-files-found: error

      # TODO(publish, manual workflow_dispatch): Developer ID 签名/公证 Secrets
      # （DEVELOPER_ID_APPLICATION_CERT / NOTARY_PROFILE 等）尚未配置，发布步骤暂缓。
      # Secrets 就绪后解开本块并接入 release-app.sh 的 publish 模式：
